name: Proofrail CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proofrail-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate
        env:
          DATABASE_URL: postgresql://proofrail:proofrail@localhost:5432/proofrail
          DATABASE_URL_UNPOOLED: postgresql://proofrail:proofrail@localhost:5432/proofrail

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Build workspaces
        run: npm run build

      - name: Publish web artifact
        id: web-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proofrail-web
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

      - name: Record digest for Proofrail
        shell: bash
        run: echo "### Proofrail artifact digest"$'\n\n'"\`sha256:${{ steps.web-artifact.outputs.artifact-digest }}\`" >> "$GITHUB_STEP_SUMMARY"
